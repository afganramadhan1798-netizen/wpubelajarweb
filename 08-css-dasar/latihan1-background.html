<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Latihan Styling Quoute</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Atomic+Age&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap");

      body {
        background-color: transparent;
        /* background-image: url(https://th.bing.com/th/id/OIP.bNfK7nRjczsb427dV6gjYwHaEo?w=294&h=183&c=7&r=0&o=7&dpr=1.5&pid=1.7&rm=3); */
      }

      h1 {
        font-family: "Atomic Age";
        font-size: 70px;
        color: transparent;
        text-align: center;
        text-transform: uppercase;
        background-image: linear-gradient(to right, red, black);
        background-clip: text;
      }

      .quote {
        font-size: 20px;
        text-align: center;
        line-height: 30px;
        word-spacing: 5px;
        font-family: Poppins;
        color: #ffffff;
        font-weight: 700;
      }

      .owner {
        font-size: 15px;
        text-align: center;
        font-family: Poppins;
        color: rgb(0, 0, 0);
        border-top: 1px solid;
        width: 55%;
        margin: 30px auto;
        padding-top: 20px;
      }

      .frame {
        width: 800px;
        height: 230px;
        padding: 10px;
        background-color: rgb(0, 0, 0, 20%);
        margin: auto;
        background-position: center;
        border-radius: 10px;
        border: 1px solid rgba(0, 0, 0, 300);
        box-shadow: 0 10px 20px rgb(0, 0, 0, 50%);
      }
    </style>
  </head>
  <body>
    <h1>Semboyan Pendidikan</h1>
    <div class="frame">
      <p class="quote">
        "'Ing ngarsa sung tulodo, ing madya jmangunkarsa, tut wuri handyani"
        <br /> <br>
        Yang Berarti : <br /> <br>
        "Di depan menjadi contoh, di tengah memberi semangat, di belakang
        memberikan dorongan".
      </p>
    </div>
    <p class="owner">-Ki Hajar Dewantara</p>
  </body>
</html>
